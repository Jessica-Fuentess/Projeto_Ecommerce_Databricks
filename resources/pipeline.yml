resources:
  pipelines:
    pipeline_ecommerce:
      name: "Transformação E-commerce (silver e gold)"
      development: false
      edition: ADVANCED
      channel: CURRENT
      serverless: true
      catalog: ${var.catalogo}
      schema: silver

      libraries:
        - glob:
            include: ../src/silver/**
        - glob:
            include: ../src/gold/**

      configuration:
        spark.databricks.delta.schema.autoMerge.enabled: "true"