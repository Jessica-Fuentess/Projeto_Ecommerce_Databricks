resources:
  dashboards:
    dashboard_diretoria:
      display_name: "Diretoria E-commerce - Visão Gold"

      # Caminho do arquivo serializado do dashboard
      serialized_dashboard: ../dashboards/diretoria_ecommerce.lvdash.json

      # Warehouse para execução das queries
      warehouse_id: ${resources.sql_warehouses.serverless_warehouse.id}

      # Embed credentials para que os diretores vejam os dados
      embed_credentials: true

  # Warehouse serverless para os dashboards e Genie
  sql_warehouses:
    serverless_warehouse:
      # Warehouse SQL gerenciado pelo Bundle
      name: "Serverless Starter Warehouse"

      cluster_size: "Small"
      enable_serverless_compute: true
      enable_photon: true

      max_num_clusters: 1
      auto_stop_mins: 10

      tags:
        custom_tags:
          - key: "projeto"
            value: "lakehouse_ecommerce"
