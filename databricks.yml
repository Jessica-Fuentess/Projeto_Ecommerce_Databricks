bundle:
  name: projeto_dados_lakehouse
  engine: direct

variables:
  catalogo:
    description: "Catálogo Unity Catalog para o lakehouse"
    default: projeto_dados

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: "https://dbc-b7666745-6272.cloud.databricks.com"  # substituir 'dbc-b7666745-6272' pelo endereço do workspace
    variables:
      catalogo: projeto_dados

  prod: # prod é uma configuração demonstrativa
    mode: production
    workspace:
      host: "https://dbc-b7666745-6272.cloud.databricks.com"
    variables:
      catalogo: projeto_dados